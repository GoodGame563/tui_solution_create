[package]
name = "tui_solution_create"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0.149"
confy = { version = "2.0.0", default-features = false, features = ["yaml_conf"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }
arboard = "3.3"
regex = "1.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
